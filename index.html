<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Imitação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>O jogo da Imitação</h1>
    <p>Alan Turing ajudou quebrar a máquina enigma na Segunda Guerra Mundial.</p>
    <h2>Linha do Tempo</h2>
    <div class="cartão"><strong>1912</strong><p>Nasce Akan Turing</p></div>
    <div class="cartão"><strong>1939</strong><p>Alan Turing chega a Bletchley Park</p></div>
    <div class="cartão"><strong>1950</strong><p>Turing propões o Teste de Turing</p></div>

    <h2>Teclado da Enigma</h2>
    <div class="teclado">
        <span class="tecla">E</span>
        <span class="tecla">N</span>
        <span class="tecla">I</span>
        <span class="tecla">G</span>
        <span class="tecla">M</span>
        <span class="tecla">A</span>
    </div>
</body>
</html>
